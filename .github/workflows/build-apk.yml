name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev curl

      - name: Prepare Android SDK for Buildozer
        run: |
          SDK="$GITHUB_WORKSPACE/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"
          cd /tmp
          curl -L -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          mkdir -p cmdline-tools
          unzip -q commandlinetools.zip -d cmdline-tools
          mkdir -p "$SDK/cmdline-tools"
          cp -R cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          export ANDROIDSDK="$SDK"
          export ANDROID_HOME="$SDK"
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "PATH=$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade "Cython<3" buildozer

      - name: Build APK with Buildozer
        run: buildozer -y android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gordinchis-apk
          path: bin/*.apk
