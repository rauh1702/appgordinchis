name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk python3-pip python3-venv autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev curl
          sudo update-alternatives --set java /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          sudo update-alternatives --set javac /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          sudo update-alternatives --set keytool /usr/lib/jvm/java-17-openjdk-amd64/bin/keytool
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"
          java -version

      - name: Prepare Android SDK for Buildozer
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$GITHUB_WORKSPACE/.buildozer/android/platform/android-sdk"
          rm -rf "$SDK"
          mkdir -p "$SDK/cmdline-tools"
          cd /tmp
          curl -fsSLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf cmdline-tools
          mkdir -p cmdline-tools
          unzip -q commandlinetools.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"
          ln -sf "$SDK/cmdline-tools/latest/bin/avdmanager" "$SDK/tools/bin/avdmanager"
          yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"
          test -x "$SDK/build-tools/37.0.0/aidl"
          test -d "$SDK/platforms/android-35"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "PATH=$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade "Cython<3" buildozer

      - name: Build APK with Buildozer
        run: buildozer -y android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gordinchis-apk
          path: bin/*.apk
